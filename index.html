<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Je classe les nombres</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Comic Sans MS", "Comic Neue", cursive, sans-serif;
        color: #29416c;
        background: linear-gradient(135deg, #e7f5ff, #fff4d5);
        touch-action: manipulation;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        touch-action: manipulation;
      }

      button:focus-visible {
        outline: 4px solid #f3aa29;
        outline-offset: 3px;
      }

      .ecran {
        display: none;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: 12px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }

      .ecran.actif {
        display: flex;
      }

      /* ACCUEIL */

      h1 {
        margin: 0;
        color: #3567bd;
        text-align: center;
        font-size: clamp(2rem, 5vw, 3.4rem);
      }

      .introduction {
        margin: 0;
        font-size: clamp(1.1rem, 2.5vw, 1.5rem);
        text-align: center;
      }

      .niveaux {
        width: min(100%, 1000px);
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .niveau {
        min-height: clamp(145px, 25vh, 220px);
        padding: 12px 6px;
        border-radius: 25px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
        color: #29416c;
        font-size: clamp(1.05rem, 2.5vw, 1.5rem);
        box-shadow: 0 6px 0 #d3dfef;
      }

      .niveau strong {
        font-size: clamp(1.25rem, 3vw, 2rem);
      }

      .niveau:nth-child(1) {
        background: #ffdc77;
      }
      .niveau:nth-child(2) {
        background: #9ee5c1;
      }
      .niveau:nth-child(3) {
        background: #c8bbff;
      }

      /* BARRE SUPÉRIEURE */

      .barre {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        z-index: 2;
      }

      .outils {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .outils.droite {
        justify-content: flex-end;
      }

      .bouton-outil {
        min-height: 44px;
        padding: 6px 12px;
        border-radius: 14px;
        background: white;
        color: #29416c;
        font-size: clamp(0.95rem, 1.8vw, 1.2rem);
        font-weight: bold;
        box-shadow: 0 3px 0 #d4dfed;
      }

      .maison {
        width: 50px;
        padding: 4px;
        background: #ffce53;
        font-size: 1.6rem;
      }

      .score {
        padding: 7px 18px;
        border-radius: 15px;
        background: white;
        font-size: clamp(1.2rem, 2.5vw, 1.8rem);
        font-weight: bold;
        white-space: nowrap;
        box-shadow: 0 3px 0 #d4dfed;
      }

      /* EXERCICE */

      #exercice {
        justify-content: flex-start;
        padding-top: 78px;
        gap: 12px;
      }

      .consigne-exercice {
        margin: 0;
        font-size: clamp(1.2rem, 2.5vw, 1.7rem);
        font-weight: bold;
        text-align: center;
      }

      /* NOMBRES À DÉPLACER */

      .nombres-proposes {
        width: min(100%, 1000px);
        min-height: 82px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 8px;
        background: #ffffff90;
        border: 3px dashed #a5c9ef;
        border-radius: 20px;
      }

      .nombre {
        width: clamp(55px, 8vw, 90px);
        height: clamp(50px, 9vh, 74px);
        flex-shrink: 0;
        border: 3px solid #70acec;
        border-radius: 16px;
        background: white;
        color: #315fb0;
        font-size: clamp(1.4rem, 3.3vw, 2.2rem);
        font-weight: bold;
        box-shadow: 0 4px 0 #c6e1fa;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        cursor: grab;
      }

      .nombre:active {
        cursor: grabbing;
      }

      .nombre.en-deplacement {
        opacity: 0.25;
      }

      /* ZONE DE CLASSEMENT */

      .zone-classement {
        width: min(100%, 1250px);
        flex: 1;
        min-height: 0;
        max-height: 44vh;
        display: grid;
        grid-template-columns: clamp(65px, 10vw, 115px) minmax(0, 1fr);
        align-items: center;
        gap: clamp(6px, 1.5vw, 20px);
      }

      .repere {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .repere svg {
        display: block;
        width: 100%;
        max-width: 105px;
        height: clamp(100px, 23vh, 190px);
      }

      .cases {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(3px, 0.8vw, 10px);
      }

      .case {
        position: relative;
        height: clamp(58px, 12vh, 95px);
        min-width: 0;
        max-width: 135px;
        flex: 1;
        border: 3px dashed #83b5eb;
        border-radius: 15px;
        background: #ffffffc9;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .case.survol {
        background: #fff0ae;
        border-color: #e4a323;
      }

      .case .nombre {
        width: 100%;
        height: 100%;
        min-width: 0;
        max-width: none;
        border: none;
        border-radius: 11px;
        background: #eaf5ff;
        box-shadow: none;
        padding: 0;
      }

      .symbole {
        flex-shrink: 0;
        font-family: Arial, sans-serif;
        font-size: clamp(1.3rem, 3vw, 2.2rem);
        font-weight: bold;
        color: #e3a027;
      }

      /* BOUTONS */

      .actions {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .action {
        min-height: 47px;
        padding: 8px 22px;
        border-radius: 15px;
        font-size: clamp(1rem, 2vw, 1.3rem);
        font-weight: bold;
        box-shadow: 0 4px 0 #d1ddec;
      }

      .verifier {
        background: #50c68b;
        color: #174b32;
      }

      .effacer {
        background: white;
        color: #315fb0;
      }

      .retour {
        background: #ffce53;
        color: #29416c;
      }

      .message {
        min-height: 1.3em;
        font-size: clamp(1rem, 2vw, 1.3rem);
        font-weight: bold;
        text-align: center;
      }

      .message.bon {
        color: #22864f;
      }
      .message.faux {
        color: #d34450;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      /* MODALE */

      .fond-modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 15px;
        background: #263b6070;
      }

      .fond-modal.visible {
        display: flex;
      }

      .modal {
        width: min(95%, 540px);
        padding: 25px;
        border: 5px solid #ffce53;
        border-radius: 25px;
        background: white;
        text-align: center;
        box-shadow: 0 8px 0 #d3dfef;
      }

      .modal h2 {
        margin-top: 0;
        color: #3567bd;
        font-size: clamp(1.5rem, 4vw, 2.1rem);
      }

      .modal p {
        font-size: clamp(1.1rem, 2.5vw, 1.4rem);
        line-height: 1.4;
        white-space: pre-line;
      }

      .resultat {
        color: #3567bd;
        font-size: clamp(2.5rem, 7vw, 4rem);
        font-weight: bold;
      }

      /* ADAPTATION AUX PETITS ÉCRANS */

      @media (max-width: 620px) {
        .ecran {
          padding: 8px;
          gap: 8px;
        }

        .niveaux {
          gap: 8px;
        }

        .niveau {
          min-height: 150px;
          padding: 8px 3px;
          border-radius: 17px;
        }

        .barre {
          left: 5px;
          right: 5px;
          gap: 4px;
        }

        .outils {
          gap: 4px;
        }

        .bouton-outil {
          min-height: 40px;
          padding: 5px 7px;
          font-size: 0.9rem;
        }

        .maison {
          width: 42px;
          font-size: 1.4rem;
        }

        .score {
          padding: 6px 10px;
          font-size: 1.05rem;
        }

        #exercice {
          padding-top: 65px;
          gap: 7px;
        }

        .nombres-proposes {
          min-height: 64px;
          gap: 6px;
          padding: 5px;
        }

        .nombre {
          width: 47px;
          height: 46px;
          min-width: 0;
          border-width: 2px;
          border-radius: 10px;
          font-size: 1.2rem;
        }

        .zone-classement {
          grid-template-columns: 48px minmax(0, 1fr);
          gap: 5px;
          max-height: 40vh;
        }

        .repere svg {
          width: 46px;
          height: 95px;
        }

        .cases {
          gap: 2px;
        }

        .case {
          height: 56px;
          border-width: 2px;
          border-radius: 9px;
        }

        .case .nombre {
          width: 100%;
          height: 100%;
          font-size: 1.15rem;
        }

        .symbole {
          font-size: 1.1rem;
        }

        .action {
          min-height: 42px;
          padding: 7px 13px;
        }

        .message {
          font-size: 0.95rem;
        }
      }

      @media (max-height: 560px) {
        #exercice {
          padding-top: 55px;
          gap: 4px;
        }

        .nombres-proposes {
          min-height: 46px;
        }

        .nombre {
          height: 40px;
        }

        .zone-classement {
          max-height: 35vh;
        }

        .case {
          height: 47px;
        }

        .repere svg {
          height: 80px;
        }

        .action {
          min-height: 36px;
        }
      }
    </style>
  </head>

  <body>
    <!-- PAGE D'ACCUEIL -->

    <section id="accueil" class="ecran actif">
      <h1>🔢 Je classe les nombres !</h1>
      <p class="introduction">Choisis ton niveau pour commencer.</p>

      <div class="niveaux">
        <button class="niveau" data-niveau="1">
          <strong>🌟 Niveau 1</strong>
          <span>De 2 à 30</span>
        </button>

        <button class="niveau" data-niveau="2">
          <strong>🚀 Niveau 2</strong>
          <span>De 10 à 50</span>
        </button>

        <button class="niveau" data-niveau="3">
          <strong>🪄 Niveau 3</strong>
          <span>De 10 à 100</span>
        </button>
      </div>
    </section>

    <!-- PAGE D'EXERCICE -->

    <section id="exercice" class="ecran">
      <header class="barre">
        <div class="outils">
          <button
            class="bouton-outil maison"
            id="maison"
            aria-label="Retour aux niveaux"
          >
            🏠
          </button>
          <button class="bouton-outil" id="consigneBtn">📖 Consigne</button>
          <button
            class="bouton-outil"
            id="recommencer"
            aria-label="Recommencer"
          >
            🔄
          </button>
        </div>

        <div class="score" id="score">0/0</div>

        <div class="outils droite">
          <button class="bouton-outil" id="resultatBtn">🏆 Résultat</button>
        </div>
      </header>

      <p class="consigne-exercice" id="texteExercice">
        Classe les nombres dans le bon ordre.
      </p>

      <div class="nombres-proposes" id="nombresProposes"></div>

      <div class="zone-classement">
        <!-- UNE SEULE IMAGE, À GAUCHE -->

        <div class="repere" id="repere"></div>

        <div class="cases" id="cases"></div>
      </div>

      <div class="message" id="message" aria-live="polite"></div>

      <div class="actions">
        <button class="action effacer" id="vider">Vider les cases</button>
        <button class="action verifier" id="verifier">✓ Vérifier</button>
      </div>
    </section>

    <!-- ÉCRAN FINAL -->

    <section id="fin" class="ecran">
      <div class="modal">
        <h1>🎉 C'est terminé !</h1>
        <p>Voici ton résultat :</p>
        <div class="resultat" id="scoreFinal">0/0</div>

        <div class="actions">
          <button class="action verifier" id="rejouer">🔄 Recommencer</button>
          <button class="action retour" id="choisirNiveau">🏠 Niveaux</button>
        </div>
      </div>
    </section>

    <!-- FENÊTRE CONSIGNE OU RÉSULTAT -->

    <div class="fond-modal" id="fondModal">
      <div class="modal" role="dialog" aria-modal="true">
        <h2 id="titreModal">📖 Consigne</h2>
        <p id="texteModal"></p>

        <div class="actions">
          <button class="action verifier" id="lireConsigne">🔊 Écouter</button>
          <button class="action retour" id="fermerModal">Fermer</button>
        </div>
      </div>
    </div>

    <script>
      const limites = {
        1: [2, 30],
        2: [10, 50],
        3: [10, 100],
      };

      const consigne =
        "Observe l'image pour savoir dans quel sens classer les nombres. " +
        "Fais glisser les cinq nombres dans les cases. " +
        "Tu peux déplacer les nombres pour corriger ton classement. " +
        "Quand tu as terminé, appuie sur Vérifier.";

      let niveau = 1;
      let exercices = [];
      let numeroExercice = 0;
      let score = 0;
      let totalTraites = 0;
      let placements = [];
      let exerciceVerrouille = false;
      let glissement = null;
      let fantome = null;
      let emplacementFantome = null;

      const $ = (id) => document.getElementById(id);

      /* NAVIGATION */

      function afficherEcran(id) {
        document.querySelectorAll(".ecran").forEach((e) => {
          e.classList.remove("actif");
        });

        $(id).classList.add("actif");
      }

      function melanger(liste) {
        for (let i = liste.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [liste[i], liste[j]] = [liste[j], liste[i]];
        }

        return liste;
      }

      /* CRÉATION DES 20 SÉRIES
   Série 1 : croissant
   Série 2 : décroissant
   Série 3 : croissant
   Série 4 : décroissant
   Etc.
*/

      function creerExercices() {
        const [min, max] = limites[niveau];
        const liste = [];

        for (let i = 0; i < 20; i++) {
          const nombres = [];

          while (nombres.length < 5) {
            const n = Math.floor(Math.random() * (max - min + 1)) + min;

            if (!nombres.includes(n)) {
              nombres.push(n);
            }
          }

          const croissant = i % 2 === 0;

          liste.push({
            nombres: melanger([...nombres]),
            solution: [...nombres].sort((a, b) => (croissant ? a - b : b - a)),
            croissant,
          });
        }

        return liste;
      }

      /* DÉMARRAGE */

      function demarrer() {
        fermerModal();

        exercices = creerExercices();
        numeroExercice = 0;
        score = 0;
        totalTraites = 0;
        exerciceVerrouille = false;

        afficherEcran("exercice");
        afficherExercice();
        actualiserScore();
      }

      /* SCORE */

      function actualiserScore() {
        $("score").textContent = `${score}/${totalTraites}`;
      }

      /* IMAGES SANS TEXTE */

      const imageCroissante = `
<svg viewBox="0 0 100 130" role="img" aria-label="Illustration de classement croissant">
  <path d="M5 115 H95" stroke="#7899b9" stroke-width="4"
        stroke-linecap="round"/>
  <rect x="13" y="90" width="18" height="25" rx="4" fill="#ffcf54"/>
  <rect x="41" y="65" width="18" height="50" rx="4" fill="#79c9a0"/>
  <rect x="69" y="35" width="18" height="80" rx="4" fill="#6ba8f5"/>
  <path d="M12 25 L50 8 L88 25" fill="none" stroke="#e6a329"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

      const imageDecroissante = `
<svg viewBox="0 0 100 130" role="img" aria-label="Illustration de classement décroissant">
  <path d="M5 115 H95" stroke="#7899b9" stroke-width="4"
        stroke-linecap="round"/>
  <rect x="13" y="35" width="18" height="80" rx="4" fill="#6ba8f5"/>
  <rect x="41" y="65" width="18" height="50" rx="4" fill="#79c9a0"/>
  <rect x="69" y="90" width="18" height="25" rx="4" fill="#ffcf54"/>
  <path d="M12 25 L50 8 L88 25" fill="none" stroke="#e6a329"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

      function afficherRepere() {
        const ex = exercices[numeroExercice];

        // Une seule illustration, toujours à gauche.
        $("repere").innerHTML = ex.croissant
          ? imageCroissante
          : imageDecroissante;
      }

      /* AFFICHAGE DE L'EXERCICE */

      function afficherExercice() {
        if (numeroExercice >= exercices.length) {
          afficherFin();
          return;
        }

        exerciceVerrouille = false;
        placements = Array(5).fill(null);

        const ex = exercices[numeroExercice];

        $("texteExercice").textContent = ex.croissant
          ? "Classe les nombres dans le bon ordre."
          : "Classe les nombres dans le bon ordre.";

        $("message").textContent = "";
        $("message").className = "message";
        $("verifier").disabled = false;

        afficherRepere();
        afficherNombres();
        afficherCases();
      }

      /* NOMBRES DISPONIBLES */

      function afficherNombres() {
        const zone = $("nombresProposes");
        zone.innerHTML = "";

        const utilises = placements.filter((n) => n !== null);

        const disponibles = exercices[numeroExercice].nombres.filter(
          (n) => !utilises.includes(n),
        );

        disponibles.forEach((n) => {
          const bouton = document.createElement("button");

          bouton.className = "nombre";
          bouton.textContent = n;
          bouton.dataset.nombre = n;
          bouton.setAttribute("aria-label", "Déplacer le nombre " + n);

          bouton.addEventListener("pointerdown", commencerGlissement);

          zone.appendChild(bouton);
        });
      }

      /* CASES ET SIGNES */

      function afficherCases() {
        const zone = $("cases");
        zone.innerHTML = "";

        const croissant = exercices[numeroExercice].croissant;

        for (let i = 0; i < 5; i++) {
          if (i > 0) {
            const symbole = document.createElement("span");
            symbole.className = "symbole";
            symbole.textContent = croissant ? "<" : ">";
            zone.appendChild(symbole);
          }

          const caseNombre = document.createElement("div");
          caseNombre.className = "case";
          caseNombre.dataset.case = i;

          caseNombre.addEventListener("pointerenter", () => {
            if (glissement) caseNombre.classList.add("survol");
          });

          caseNombre.addEventListener("pointerleave", () => {
            caseNombre.classList.remove("survol");
          });

          const valeur = placements[i];

          if (valeur !== null) {
            const bouton = document.createElement("button");

            bouton.className = "nombre";
            bouton.textContent = valeur;
            bouton.dataset.nombre = valeur;
            bouton.setAttribute("aria-label", "Déplacer le nombre " + valeur);

            bouton.addEventListener("pointerdown", commencerGlissement);

            caseNombre.appendChild(bouton);
          }

          zone.appendChild(caseNombre);
        }
      }

      /* GLISSER-DÉPOSER */

      function commencerGlissement(e) {
        if (exerciceVerrouille || glissement) return;

        e.preventDefault();

        const bouton = e.currentTarget;
        const nombre = Number(bouton.dataset.nombre);
        const caseOrigine = bouton.closest(".case");

        glissement = {
          nombre,
          origine: caseOrigine ? Number(caseOrigine.dataset.case) : null,
        };

        fantome = bouton.cloneNode(true);
        fantome.style.position = "fixed";
        fantome.style.zIndex = "1000";
        fantome.style.pointerEvents = "none";
        fantome.style.opacity = "0.9";
        fantome.style.width = bouton.getBoundingClientRect().width + "px";
        fantome.style.height = bouton.getBoundingClientRect().height + "px";

        document.body.appendChild(fantome);
        bouton.classList.add("en-deplacement");

        deplacerFantome(e);

        document.addEventListener("pointermove", deplacerFantome);
        document.addEventListener("pointerup", terminerGlissementGlobal, {
          once: true,
        });
      }

      function deplacerFantome(e) {
        if (!fantome) return;

        fantome.style.left = e.clientX - fantome.offsetWidth / 2 + "px";

        fantome.style.top = e.clientY - fantome.offsetHeight / 2 + "px";

        document.querySelectorAll(".case").forEach((c) => {
          c.classList.remove("survol");
        });

        const cible = document.elementFromPoint(e.clientX, e.clientY);
        const caseCible = cible ? cible.closest(".case") : null;

        if (caseCible) {
          caseCible.classList.add("survol");
        }
      }

      function terminerGlissementGlobal(e) {
        document.removeEventListener("pointermove", deplacerFantome);

        if (fantome) {
          fantome.remove();
          fantome = null;
        }

        document.querySelectorAll(".en-deplacement").forEach((el) => {
          el.classList.remove("en-deplacement");
        });

        document.querySelectorAll(".case").forEach((c) => {
          c.classList.remove("survol");
        });

        if (!glissement) return;

        const cible = document.elementFromPoint(e.clientX, e.clientY);

        const caseCible = cible ? cible.closest(".case") : null;
        const zoneSource = cible ? cible.closest("#nombresProposes") : null;

        if (caseCible) {
          deposerDansCase(Number(caseCible.dataset.case));
        } else if (zoneSource) {
          remettreDansSource();
        }

        glissement = null;

        afficherNombres();
        afficherCases();
      }

      /* DÉPOSER UN NOMBRE */

      function deposerDansCase(index) {
        if (!glissement || exerciceVerrouille) return;

        const nombre = glissement.nombre;
        const origine = glissement.origine;

        // Si le nombre vient d'une autre case, on la libère.
        if (origine !== null) {
          placements[origine] = null;
        }

        // Le nombre déjà présent dans la case cible retourne
        // automatiquement dans la zone des nombres disponibles.
        placements[index] = nombre;
      }

      /* RAMENER UN NOMBRE À SON EMPLACEMENT DE DÉPART */

      function remettreDansSource() {
        if (!glissement) return;

        if (glissement.origine !== null) {
          placements[glissement.origine] = null;
        }
      }

      /* VIDER LES CASES */

      function viderCases() {
        if (exerciceVerrouille) return;

        placements = Array(5).fill(null);

        $("message").textContent = "";
        $("message").className = "message";

        afficherNombres();
        afficherCases();
      }

      /* VÉRIFICATION */

      function verifierReponse() {
        if (exerciceVerrouille) return;

        if (placements.some((n) => n === null)) {
          $("message").textContent =
            "Place les cinq nombres avant de vérifier.";
          $("message").className = "message faux";
          return;
        }

        exerciceVerrouille = true;
        totalTraites++;

        const solution = exercices[numeroExercice].solution;

        const correct = placements.every((n, i) => n === solution[i]);

        if (correct) {
          score++;
          $("message").textContent = "Bravo !";
          $("message").className = "message bon";
        } else {
          $("message").textContent = "Essaie encore dans la prochaine série !";
          $("message").className = "message faux";
        }

        actualiserScore();
        $("verifier").disabled = true;

        setTimeout(() => {
          numeroExercice++;

          if (numeroExercice >= exercices.length) {
            afficherFin();
          } else {
            afficherExercice();
          }
        }, 500);
      }

      /* RÉSULTAT : AUCUN MESSAGE PERSONNALISÉ */

      function ouvrirResultat() {
        $("titreModal").textContent = "🏆 Ton résultat";
        $("texteModal").textContent = `${score}/${totalTraites}`;
        $("lireConsigne").style.display = "none";
        $("fondModal").classList.add("visible");
      }

      /* CONSIGNE */

      function ouvrirConsigne() {
        $("titreModal").textContent = "📖 Consigne";
        $("texteModal").textContent = consigne;
        $("lireConsigne").style.display = "inline-block";
        $("fondModal").classList.add("visible");
      }

      function fermerModal() {
        $("fondModal").classList.remove("visible");

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      }

      function lireConsigne() {
        if (!("speechSynthesis" in window)) return;

        window.speechSynthesis.cancel();

        const parole = new SpeechSynthesisUtterance(consigne);
        parole.lang = "fr-FR";
        parole.rate = 0.9;

        const voix = window.speechSynthesis
          .getVoices()
          .find((v) => v.lang.toLowerCase().startsWith("fr"));

        if (voix) parole.voice = voix;

        window.speechSynthesis.speak(parole);
      }

      /* FIN DES 20 SÉRIES */

      function afficherFin() {
        $("scoreFinal").textContent = `${score}/${totalTraites}`;
        afficherEcran("fin");
      }

      /* BOUTONS */

      document.querySelectorAll("[data-niveau]").forEach((bouton) => {
        bouton.addEventListener("click", () => {
          niveau = Number(bouton.dataset.niveau);
          demarrer();
        });
      });

      $("maison").addEventListener("click", () => {
        fermerModal();
        afficherEcran("accueil");
      });

      $("recommencer").addEventListener("click", demarrer);
      $("rejouer").addEventListener("click", demarrer);

      $("choisirNiveau").addEventListener("click", () => {
        afficherEcran("accueil");
      });

      $("vider").addEventListener("click", viderCases);
      $("verifier").addEventListener("click", verifierReponse);
      $("resultatBtn").addEventListener("click", ouvrirResultat);
      $("consigneBtn").addEventListener("click", ouvrirConsigne);

      $("fermerModal").addEventListener("click", fermerModal);
      $("lireConsigne").addEventListener("click", lireConsigne);

      $("fondModal").addEventListener("click", (e) => {
        if (e.target === $("fondModal")) fermerModal();
      });

      /* RACCOURCIS ENSEIGNANT */

      document.addEventListener("keydown", (e) => {
        if (!$("exercice").classList.contains("actif")) return;
        if (!e.ctrlKey) return;

        if (e.key === "ArrowRight") {
          e.preventDefault();

          if (exerciceVerrouille) return;

          // L'exercice ignoré n'entre pas dans le score.
          numeroExercice++;

          if (numeroExercice >= exercices.length) {
            afficherFin();
          } else {
            afficherExercice();
          }
        }

        if (e.key === "ArrowLeft") {
          e.preventDefault();

          if (numeroExercice > 0) {
            numeroExercice--;
            afficherExercice();
          }
        }
      });
    </script>
  </body>
</html>
